<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Activate your Lazada membership — GoFit X Gym Geylang</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="canonical" href="https://www.gofitx.sg/lazada-new-membership-activation">
<meta name="description" content="GoFit member guide — not for public listing.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GoFit X — member job aid  ·  step-by-step template v1
   Same theme as the main site. Steps are deep-linkable (#step-4)
   so staff can send someone straight to where they're stuck.
   ============================================================ */
:root{
  --yellow:#FCD900;--black:#000;--red:#FF536C;--teal:#47D5CD;
  --surface:#0e0e0e;--line:#242424;
  --display:'Archivo','Arial Narrow',Arial,sans-serif;
  --body:'Hanken Grotesk',Arial,Helvetica,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:#000;color:#fff;font-family:var(--body);min-height:100dvh;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;position:relative;min-height:100dvh;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
@media (max-width:600px){#app{border:0}}

.agile{font-family:var(--display);font-weight:700;text-transform:uppercase;
  line-height:.9;color:var(--yellow);display:block}

/* ---------- header ---------- */
.ghead{padding:calc(env(safe-area-inset-top) + 18px) var(--pad) 0}
.crumb{display:flex;align-items:center;gap:10px}
.crumb a{font:800 10px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.45);text-decoration:none}
.crumb .lockup{width:78px;margin-left:auto}
.crumb .lockup img{width:100%;height:auto;display:block}
.gtitle{font-size:34px;margin-top:16px}
@media (min-width:420px){.gtitle{font-size:40px}}
.gmeta{font:500 15.5px/1.6 var(--body);color:rgba(255,255,255,.6);margin-top:11px}
.gmeta b{color:#fff;font-weight:800}

/* ---------- progress ---------- */
.gcount{font:800 13px/1 var(--body);letter-spacing:.06em;color:var(--yellow);
  text-transform:uppercase;padding:22px var(--pad) 0}
.gcount b{font-weight:800}
.prog{display:flex;gap:4px;padding:14px var(--pad) 0}
.prog span{height:3px;flex:1;background:#2b2b2b;transition:background .18s}
.prog span.done{background:var(--yellow)}
.progtext{font:700 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.42);padding:11px var(--pad) 0}

/* ---------- step ---------- */
.step{padding:20px var(--pad) 0;display:none}
.step.on{display:block}
.srow{display:flex;gap:14px;align-items:flex-start}
.snum{font-family:var(--display);font-weight:700;font-variation-settings:'wdth' 108;
  font-size:34px;line-height:.86;color:var(--yellow);min-width:38px}
.stitle{font:800 19px/1.3 var(--body)}
.sbody{font:500 16px/1.6 var(--body);color:rgba(255,255,255,.72);margin-top:10px}
.sbody b{color:#fff;font-weight:800}

/* ---------- screenshots ---------- */
.shots{margin-top:15px;display:flex;flex-direction:column;gap:12px}
.shot{background:#111;border-left:4px solid var(--yellow);
  position:relative;display:block;width:100%;max-width:330px}
.shot img{width:100%;height:auto;display:block}
.shotlbl{position:absolute;left:0;top:0;background:var(--yellow);color:#000;
  font:800 10px/1 var(--body);letter-spacing:.16em;padding:6px 8px}

/* ---------- callouts ---------- */
.warn{background:var(--yellow);color:#000;padding:15px;margin-top:15px}
.warn .wh{display:block;font:800 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase}
.warn .wb{display:block;font:500 15.5px/1.55 var(--body);margin-top:8px}
.warn .wb b{font-weight:800}
.info{background:var(--surface);border-left:4px solid var(--teal);padding:15px;margin-top:15px}
.info .ih{display:block;font:800 11px/1 var(--body);letter-spacing:.18em;
  text-transform:uppercase;color:var(--teal)}
.info .ib{display:block;font:500 15.5px/1.55 var(--body);color:rgba(255,255,255,.75);margin-top:8px}
.info ul{margin:9px 0 0 17px}
.info li{font:500 15.5px/1.7 var(--body);color:rgba(255,255,255,.75)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;
  font-family:var(--body);text-decoration:none;padding:17px;font:800 15.5px/1 var(--body)}
.btn.pri{background:var(--yellow);color:#000}
.btn.sec{background:transparent;color:#fff;border:2px solid #2e2e2e}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.nav{display:flex;gap:9px;padding:22px var(--pad) 0}
.nav .btn.sec{flex:0 0 38%}
.nav .btn.pri{flex:1}

.help{margin-top:24px;border-top:1px solid var(--line);padding:16px var(--pad) 0;
  display:flex;align-items:center;gap:12px;margin-left:calc(var(--pad) * -1);
  margin-right:calc(var(--pad) * -1)}
.help .ht{flex:1;font:500 14px/1.45 var(--body);color:rgba(255,255,255,.55)}
.help a{background:#141414;border:1.5px solid #2e2e2e;color:var(--yellow);
  font:800 12.5px/1 var(--body);letter-spacing:.08em;padding:11px 13px;text-decoration:none}

/* ---------- done panel ---------- */
.donebox{text-align:center;padding:8px 0 0}
.donebox .tick{font-family:var(--display);font-weight:700;font-size:52px;color:var(--yellow);line-height:1}
.donebox .dt{font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:27px;color:#fff;margin-top:12px;line-height:1}
.donebox .db{font:500 13.5px/1.5 var(--body);color:rgba(255,255,255,.65);margin-top:12px}

/* ---------- all-steps drawer ---------- */
.toclink{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);
  cursor:pointer;font:800 12.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
  color:var(--yellow);padding:18px var(--pad);text-align:left;margin-top:26px}
#toc{display:none;padding:0 var(--pad) 4px}
#toc.on{display:block}
.tocitem{display:flex;gap:13px;width:100%;background:none;border:0;cursor:pointer;
  text-align:left;padding:13px 0;border-bottom:1px solid var(--line);font-family:var(--body)}
.tocitem .n{font-family:var(--display);font-weight:700;font-size:14px;color:var(--yellow);width:22px}
.tocitem .t{font:600 15px/1.4 var(--body);color:rgba(255,255,255,.72);flex:1}
.tocitem.on .t{color:#fff;font-weight:800}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--pad:40px}
  #app{max-width:860px;padding-bottom:56px}
  .gtitle{font-size:56px}
  .nav{display:flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">

  <div class="ghead">
    <div class="crumb">
      <a href="index.html#guides">← GoFit X</a>
      <span class="lockup"></span>
    </div>
    <div class="agile gtitle">LAZADA PURCHASED TERM REGISTRATION</div>
    <div class="gmeta" id="gmeta"></div>
  </div>

  <div id="anchor">
    <div class="gcount" id="gcount"></div>
    <div class="prog" id="prog"></div>
    <div class="progtext" id="progtext"></div>
  </div>

  <div id="steps"></div>

  <button class="toclink" id="tocBtn">All steps ▾</button>
  <div id="toc"></div>
</div>

<script>
/* ================================================================
   CONTENT — everything for this guide lives in one array.
   Copy this file, swap GUIDE + STEPS, and you have the next one.
   ================================================================ */
var HOME='index.html#home';
var APP_GUIDE='mobile-app-tutorial.html';
var WA='6588779895';
function wa(m){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(m);}

var GUIDE={
  title:'Activate your Lazada membership',
  intro:'Bought a GoFit membership voucher on Lazada? This walks you through redeeming it. Have the <b>Lazada app open</b> on your phone before you start.',
  time:'about 3 minutes'
};



var STEPS=[
  {t:'Find and copy your coupon code',
   b:'Open the Lazada app and go to your order. Tap the GoFit membership coupon code to copy it, then redeem the voucher in the Lazada app. You will paste the code in step 3.',
   shots:[{u:'img/lazada-new-membership-activation-01.jpg',l:'In Lazada',a:'The Lazada coupon redemption screen showing the GoFit membership code and the Redeem at Store button'}]},

  {t:'Open the registration link',
   b:'Tap the button below to open the GoFit registration page. Keep this guide open in another tab if you can.',
   shots:[],
   link:{u:'https://evolutionwellness-sg.perfectgym.pl/ClientPortal2/Registration/Start?clubId=1&utm_source=Lazada&utm_medium=email&utm_campaign=sales',t:'Open the registration page'}},

  {t:'Select "I have a discount code"',
   b:'On the first screen, choose the option to enter a discount code.',
   shots:[{u:'img/voucher-new-membership-activation-01.jpg',l:'On your phone',a:'The GoFit sign up screen with the I have a discount code button at the bottom'}]},

  {t:'Paste your coupon code',
   b:'Paste the code you copied from Lazada, then tap <b>Next</b>.',
   shots:[{u:'img/voucher-new-membership-activation-02.jpg',l:'On your phone',a:'The discount code field with a code typed in and the Next button below'}]},

  {t:'Click "Apply voucher"',
   b:'Confirm the voucher so the discount is applied to your membership.',
   shots:[{u:'img/voucher-new-membership-activation-03.jpg',l:'On your phone',a:'Confirmation screen reading Congratulations with the Apply voucher button'}]},

  {t:'Select your membership',
   b:'Choose the membership your voucher covers, then tap <b>Next</b>.',
   shots:[{u:'img/voucher-new-membership-activation-04.png',l:'On your phone',a:'The membership now showing $0.00 with the original price struck through'}]},

  {t:'Choose whether you want Plus',
   b:'Plus is an optional upgrade. Take it or skip it — either way, tap <b>Next</b>.',
   warn:{h:'Plus needs a card',b:'Plus is billed separately from your voucher, so you can only add it if you pay by <b>credit or debit card</b>. Skip it if you want to pay nothing today.'},
   info:{h:'What Plus adds',list:['Access to all GoFit clubs','Evolt 360 body scanner','HydroMassage lounger','Personal locker']},
   shots:[{u:'img/voucher-new-membership-activation-05.png',l:'On your phone',a:'The optional Goal Plus upgrade offered at fifteen dollars a month'}]},

  {t:'Choose your start date',
   b:'Pick the date you want your membership to begin, then tap <b>Next</b>.',
   shots:[{u:'img/plus-upgrade-tutorial-04.png',l:'On your phone',a:'A list of dates to start the membership within the next fourteen days'}]},

  {t:'Fill in your details',
   b:'Enter your personal details and create a password for your account, then tap <b>Next</b>. You will use this password to log into the GoFit app.',
   shots:[{u:'img/guest-registration-tutorial-03.png',l:'On your phone',a:'The personal details form with name, ID, gender and date of birth fields'}]},

  {t:'Sign the membership agreement',
   b:'Read the agreement, then accept and sign it.',
   shots:[{u:'img/plus-upgrade-tutorial-06.png',l:'On your phone',a:'The signature panel with a signature drawn and the Ok button'}]},

  {t:'Select Cash as payment',
   b:'Your voucher already covers the cost, so there is nothing to pay here.',
   warn:{h:'Important',b:'Select <b>Cash</b>. Do not select debit or credit card — that would charge you a second time.'},
   shots:[{u:'img/voucher-new-membership-activation-09.png',l:'On your phone',a:'The payment screen with Cash selected above the Debit slash Credit Card option'}]},

  {t:'Download the GoFit app',
   b:'Your registration is done. Now download the app — this is how you get into the gym.',
   warn:{h:'Do this before your first visit',b:'You open the door by scanning the QR code from the app at the entrance. There is no keyfob and no card, so without the app you will not get in.'},
   shots:[{u:'img/mobile-app-tutorial-07.jpg',l:'At the entrance',a:'A member scanning the QR code from the GoFit app at the entrance reader, which reads access allowed'}],
   guide:'How to use the GoFit app'}
];


/* ================================================================
   BUILD
   ================================================================ */
var LOGO='img/gofitx-logo.png';
document.querySelector('.crumb .lockup').innerHTML='<img src="'+LOGO+'" alt="GoFit X Gym Geylang">';
document.getElementById('gmeta').innerHTML=GUIDE.intro;
document.getElementById('gcount').innerHTML='<b>'+STEPS.length+' steps</b> · '+GUIDE.time;

document.getElementById('steps').innerHTML=STEPS.map(function(s,i){
  var sh=s.shots||[];
  var shots=sh.length?'<div class="shots'+(sh.length===1?' single':'')+'">'+
    sh.map(function(p,j){
      return '<figure class="shot">'+
        '<img src="'+p.u+'" alt="'+p.a+'" loading="lazy" decoding="async">'+
        '<figcaption class="shotlbl">'+p.l+'</figcaption></figure>';
    }).join('')+'</div>':'';
  var warn=s.warn?'<div class="warn"><span class="wh">'+s.warn.h+'</span>'+
    '<span class="wb">'+s.warn.b+'</span></div>':'';
  var info=s.info?'<div class="info"><span class="ih">'+s.info.h+'</span><ul>'+
    s.info.list.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>':'';
  var link=s.link?'<div style="margin-top:15px"><a class="btn pri" href="'+s.link.u+
    '" target="_blank" rel="noopener">'+s.link.t+' →</a></div>':'';
  var done=s.guide?'<div style="margin-top:20px"><a class="btn pri" href="'+APP_GUIDE+'">'+
    s.guide+' →</a></div>':'';
  return '<section class="step" id="step-'+(i+1)+'">'+
    '<div class="srow"><span class="snum">'+String(i+1).padStart(2,'0')+'</span>'+
    '<div><div class="stitle">'+s.t+'</div>'+(s.b?'<div class="sbody">'+s.b+'</div>':'')+'</div></div>'+
    warn+info+shots+link+done+
    '<div class="nav"><button class="btn sec" data-back'+(i===0?' disabled':'')+'>Back</button>'+
    (i===STEPS.length-1
      ? '<a class="btn pri" href="'+HOME+'">Finish →</a>'
      : '<button class="btn pri" data-next>Next step</button>')+'</div>'+
    '<div class="help"><span class="ht">Stuck on this step?</span>'+
    '<a href="'+wa("Hi GoFit X, I'm stuck on step "+(i+1)+" of the Lazada membership activation guide.")+
    '" target="_blank" rel="noopener">WhatsApp us</a></div>'+
  '</section>';
}).join('');

document.getElementById('prog').innerHTML=STEPS.map(function(){return '<span></span>';}).join('');
document.getElementById('toc').innerHTML=STEPS.map(function(s,i){
  return '<button class="tocitem" data-jump="'+(i+1)+'"><span class="n">'+
    String(i+1).padStart(2,'0')+'</span><span class="t">'+s.t+'</span></button>';}).join('');

/* ================================================================
   NAVIGATION — hash routed, so #step-4 is a shareable link
   ================================================================ */
var cur=1;
function go(n,push){
  n=Math.max(1,Math.min(STEPS.length,n));
  cur=n;
  Array.prototype.forEach.call(document.querySelectorAll('.step'),function(s){s.classList.remove('on');});
  document.getElementById('step-'+n).classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('#prog span'),function(b,i){
    b.classList.toggle('done',i<n);});
  document.getElementById('progtext').textContent='Step '+n+' of '+STEPS.length;
  Array.prototype.forEach.call(document.querySelectorAll('[data-jump]'),function(b){
    b.classList.toggle('on',+b.dataset.jump===n);});
  positionView(n);
  if(push!==false)history.pushState({n:n},'','#step-'+n);
}
/* Step 1 opens at the very top. Every later step opens with the
   "12 steps" line and progress bar at the top of the screen, so the
   title and intro are already scrolled past. */
function positionView(n){
  if(n===1){window.scrollTo(0,0);return;}
  var a=document.getElementById('anchor');
  var y=a.getBoundingClientRect().top+window.pageYOffset;
  window.scrollTo(0,Math.max(0,Math.round(y)));
}

document.addEventListener('click',function(e){
  if(e.target.closest('[data-next]')){go(cur+1);return;}
  if(e.target.closest('[data-back]')){go(cur-1);return;}
  var j=e.target.closest('[data-jump]');
  if(j){go(+j.dataset.jump);document.getElementById('toc').classList.remove('on');
    document.getElementById('tocBtn').textContent='All steps ▾';return;}
  if(e.target.closest('#tocBtn')){
    var t=document.getElementById('toc');t.classList.toggle('on');
    document.getElementById('tocBtn').textContent=t.classList.contains('on')?'All steps ▴':'All steps ▾';return;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
});
window.addEventListener('popstate',function(e){
  go((e.state&&e.state.n)||parseInt((location.hash.match(/\d+/)||[1])[0],10),false);});

var start=parseInt((location.hash.match(/step-(\d+)/)||[0,1])[1],10);
go(start,false);
/* fonts and images shift layout as they arrive, so re-seat the view once settled */
window.addEventListener('load',function(){positionView(cur);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){positionView(cur);});
history.replaceState({n:start},'','#step-'+start);
</script>
</body>
</html>
